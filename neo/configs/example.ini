; =============================================================================
; Neo Training Configuration
; =============================================================================
;
; This configuration file controls all training hyperparameters for the
; Neo super-resolution model. Copy this file and modify the paths and
; parameters for your specific training run.
;
; Usage:
;   python train.py neo/configs/example.ini
;
; =============================================================================

[DEFAULT]
; Paths to paired FITS image directories.
; HST and HSC directories must contain files with matching filenames.
; HST cutouts should be ~600x600 pixels, HSC cutouts ~100x100 pixels.
hst_path_train = /path/to/hst/train
hsc_path_train = /path/to/hsc/train
hst_path_val = /path/to/hst/val
hsc_path_val = /path/to/hsc/val

[HST_DIM]
; Spatial dimension of HST images after padding (must be 6x HSC_DIM)
hst_dim = 768

[HSC_DIM]
; Spatial dimension of HSC images after padding
hsc_dim = 128

[COMET_TAG]
; Tag for organizing experiments in Comet ML
comet_tag = neo-baseline

[BATCH_SIZE]
; Number of image pairs per training batch.
; Reduce if running out of GPU memory (each pair is ~768x768).
batch_size = 4

[GAN_STEPS]
; Total number of training steps (not epochs).
; One step = one generator update on one batch.
gan_steps = 100000

[SAVE_STEPS]
; Save model checkpoints every N steps.
save_steps = 5000

[DATA_AUG]
; Enable random flip augmentations (horizontal and vertical).
data_aug = True

[IDENTIFIER]
; String identifier appended to the model checkpoint filename.
; Useful for distinguishing between experiment runs.
identifier = "baseline_v1"

[DISPLAY_STEPS]
; Log metrics and visualizations to Comet ML every N steps.
display_steps = 500

[LR]
; Generator learning rate (Adam optimizer).
lr = 0.0002

[DISC_LR]
; Discriminator learning rate (Adam optimizer).
; Can be set lower than generator LR to stabilize training.
disc_lr = 0.0002

[LAMBDA_RECON]
; Weight for L1 pixel reconstruction loss.
; Higher values produce sharper but potentially noisier results.
lambda_recon = 200

[LAMBDA_SEGMAP]
; Weight for segmentation-masked L1 loss.
; Emphasizes reconstruction quality on detected astronomical sources.
lambda_segmap = 200

[LAMBDA_VGG]
; Weight for VGG-19 perceptual loss.
; Encourages high-level feature similarity with ground truth.
lambda_vgg = 200

[LAMBDA_SCATTERING]
; Weight for wavelet scattering transform loss.
; Preserves multi-scale morphological structure.
lambda_scattering = 1

[LAMBDA_ADV]
; Weight for adversarial (GAN) loss.
; Higher values produce more realistic but less stable training.
lambda_adv = 5

[DISC_UPDATE_FREQ]
; Update discriminator every N generator steps.
; Values > 1 give the generator a head start and can stabilize training.
disc_update_freq = 3

[PRETRAINED_GENERATOR]
; Filename of a pretrained generator checkpoint in the models/ directory.
; Leave empty to train from scratch.
pretrained_generator =

[PRETRAINED_DISCRIMINATOR]
; Filename of a pretrained discriminator checkpoint in the models/ directory.
; Leave empty to train from scratch.
pretrained_discriminator =

[VGG_LOSS_WEIGHTS]
; Per-layer weights for VGG perceptual loss (5 values for 5 VGG blocks).
; [relu1_1, relu2_1, relu3_1, relu4_1, relu5_1]
; Default uses only the first two (low-level) layers.
vgg_loss_weights = [1.0, 1.0, 0.0, 0.0, 0.0]
