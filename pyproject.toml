[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-sr"
version = "1.0.0"
description = "Photometric super-resolution for astronomical imagery using conditional GANs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Samuel Kahn"},
]
keywords = [
    "astronomy",
    "super-resolution",
    "deep-learning",
    "generative-adversarial-network",
    "pix2pix",
    "hubble",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "torchlayers>=0.1.1",
    "kymatio>=0.3.0",
    "comet-ml>=3.31.0",
    "astropy>=5.0",
    "sep>=1.2.0",
    "scikit-image>=0.19.0",
    "scikit-learn>=1.0",
    "opencv-python>=4.5.0",
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "tqdm>=4.62.0",
]

[project.urls]
Homepage = "https://github.com/samuelhkahn/hubble-pix2pix"
Repository = "https://github.com/samuelhkahn/hubble-pix2pix"
# Documentation = ""  # TODO: add docs URL when available

[tool.setuptools.packages.find]
include = ["neo*"]
